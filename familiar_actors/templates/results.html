{% if actor %}
<div class="results-section">
    <div class="query-actor">
        {% if actor.tmdb_image_url %}
        <img src="{{ actor.tmdb_image_url }}" alt="{{ actor.name }}" class="query-actor-img">
        {% endif %}
        <div>
            <h2>Actors who look like {{ actor.name }}</h2>
            <a class="query-actor-tmdb" href="https://www.themoviedb.org/person/{{ actor.tmdb_id }}" target="_blank" rel="noopener">View on TMDB &#8599;</a>
        </div>
    </div>

    {% if results %}
    {% include "_results_grid.html" %}
    {% else %}
    <p class="no-results">No similar actors found. The embedding index may need to be built.</p>
    {% endif %}
</div>
{% endif %}
