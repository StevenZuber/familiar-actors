<div id="photo-upload" class="photo-upload" hidden>
    <input type="file" id="photo-input" accept="image/*" hidden>
    <button type="button" id="photo-button" class="photo-button">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
        </svg>
        Take or choose a photo
    </button>
    <img id="photo-preview" class="photo-preview" alt="Your uploaded photo" hidden>
    <p class="photo-note">Your photo is matched in memory and never stored.</p>
</div>
